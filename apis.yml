aid: '222'
name: '222'
description: '222 is a consumer social app that matches compatible strangers for curated,
  in-real-life group experiences — dinners, events, and pop-up hangouts — to help people
  meet new people, discover their city, and deepen relationships. There are no profiles,
  DMs, or swiping: members complete a personality/values survey that builds a curation
  profile, then receive invites to nearby experiences where the app seats them with the
  people they are most compatible with. Founded in Los Angeles and now operating in cities
  including Los Angeles and New York, 222 is backed by General Catalyst and Y Combinator.
  This profile is maintained in the API Evangelist network; 222 is a consumer mobile
  application with no public developer API surface at this time.'
